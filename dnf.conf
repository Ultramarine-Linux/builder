[main]
keepcache=1
retries=20
gpgcheck=1
install_weak_deps=0
metadata_expire=-1
best=1
tsflags=nodocs
max_parallel_downloads=20
reposdir=/dev/null

[ultramarine]
name=Ultramarine 45
baseurl=https://repos.fyralabs.com/um45
type=rpm-md
skip_if_unavailable=False
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-um45
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra]
name=Terra 45
baseurl=https://repos.fyralabs.com/terra45
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra45
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra-extras]
name=Terra 45 (Extras)
baseurl=https://repos.fyralabs.com/terra45-extras
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra45-extras
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=150

[terra-mesa]
name=Terra 45 (Mesa)
baseurl=https://repos.fyralabs.com/terra45-mesa
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra45-mesa
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=80

[terra-multimedia]
name=Terra 45 (Multimedia)
baseurl=https://repos.fyralabs.com/terra45-multimedia
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra45-multimedia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[terra-nvidia]
name=Terra 45 (NVIDIA)
baseurl=https://repos.fyralabs.com/terra45-nvidia
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra45-nvidia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80
excludepkgs=dkms-nvidia*

[fedora]
name=Fedora 45 - $basearch
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-45&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-45-$basearch
skip_if_unavailable=False
excludepkgs=fedora-release*

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f45&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-45-$basearch
skip_if_unavailable=False
excludepkgs=fedora-release*
