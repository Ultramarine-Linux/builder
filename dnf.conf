[main]
keepcache=1
retries=20
gpgcheck=1
install_weak_deps=0
metadata_expire=-1
best=1
tsflags=nodocs
max_parallel_downloads=20
reposdir=/dev/null

[ultramarine]
name=Ultramarine Linux $releasever
baseurl=https://repos.fyralabs.com/um$releasever/
type=rpm-md
skip_if_unavailable=False
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-um$releasever
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra]
name=Terra $releasever
baseurl=https://repos.fyralabs.com/terra$releasever
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra-extras]
name=Terra $releasever (Extras)
baseurl=https://repos.fyralabs.com/terra$releasever-extras
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-extras
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=150

[terra-mesa]
name=Terra $releasever (Mesa)
baseurl=https://repos.fyralabs.com/terra$releasever-mesa
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-mesa
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[terra-multimedia]
name=Terra $releasever (Multimedia)
baseurl=https://repos.fyralabs.com/terra$releasever-multimedia
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-multimedia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[terra-nvidia]
name=Terra $releasever (NVIDIA)
baseurl=https://repos.fyralabs.com/terra$releasever-nvidia
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-nvidia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80
excludepkgs=dkms-nvidia*

[fedora]
name=Fedora $releasever - $basearch
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-$releasever-$basearch
skip_if_unavailable=False

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-$releasever-$basearch
skip_if_unavailable=False
