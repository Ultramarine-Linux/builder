[main]
keepcache=1
retries=20
gpgcheck=1
install_weak_deps=0
metadata_expire=-1
best=1
tsflags=nodocs
max_parallel_downloads=20
reposdir=/dev/null

[ultramarine]
name=Ultramarine Linux rawhide
baseurl=https://repos.fyralabs.com/umrawhide
type=rpm-md
skip_if_unavailable=False
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-umrawhide
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra]
name=Terra rawhide
baseurl=https://repos.fyralabs.com/terrarawhide
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terrarawhide
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[terra-extras]
name=Terra rawhide (Extras)
baseurl=https://repos.fyralabs.com/terrarawhide-extras
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terrarawhide-extras
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=150

[terra-mesa]
name=Terra rawhide (Mesa)
baseurl=https://repos.fyralabs.com/terrarawhide-mesa
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terrarawhide-mesa
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=80

[terra-multimedia]
name=Terra rawhide (Multimedia)
baseurl=https://repos.fyralabs.com/terrarawhide-multimedia
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terrarawhide-multimedia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[terra-nvidia]
name=Terra rawhide (NVIDIA)
baseurl=https://repos.fyralabs.com/terrarawhide-nvidia
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terrarawhide-nvidia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80
excludepkgs=dkms-nvidia*

[fedora]
name=Fedora rawhide - $basearch
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-rawhide&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-rawhide-$basearch
skip_if_unavailable=False
excludepkgs=fedora-release*

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-frawhide&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-rawhide-$basearch
skip_if_unavailable=False
excludepkgs=fedora-release*
